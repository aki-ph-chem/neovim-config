name: update lazy-lock.json 
on:
  workflow_dispatch:
    inputs:
      # Input name (label visible to the user)
      message: 
        description: 'Please enter the purpose or a note for this manual run.' # Required. The description displayed in the UI.
        required: false # Do not make input mandatory (setting to true makes it mandatory)
        type: string    # Specify the type of input value (string, choice, boolean, environment)
        default: 'Manual Run' # Default value
  schedule:
    # Runs daily at UTC 15:00 (JST 0:00)
    - cron: '0 15 * * *'

jobs:
  udpate-lockfile:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize log file
        run: |
          mkdir ./ci-logs/
          TZ=Asia/Tokyo date > ./ci-logs/started_at.txt
          echo '' > ./ci-logs/update.md

      - name: cache neovim plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.local/share/nvim/lazy"
          key: ${{ runner.os }}-neovim-${{ hashFiles('**/lazy-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-neovim-

      - name: setup config files 
        run: |
          mkdir "$HOME/.config"
          ln -s "$PWD/nvim" "$HOME/.config/nvim"

      - name: install plugins
        run: |
          TS_OFF=1 USER=aki "$NVIM_EXEC_PATH"  --headless +qa

      - name: update plugins
        run: |
          {
            echo '### update nvim plugins'
            echo ''
            TZ=Asia/Tokyo date
            echo ''
            echo '```'
          } >> ./ci-logs/update.md
          TS_OFF=1 USER=aki "$NVIM_EXEC_PATH"  --headless "+Lazy! sync" +qa\
            | ansifilter\
            | tee -a ./ci-logs/update.md
          echo '```' >> ./ci-logs/update.md

      # PR body は巨大（Lazy sync の全ログ）なので、output/with ではなく
      # ファイルに書いて body-path で渡す。環境変数経由だと Docker アクションの
      # 起動時に "Argument list too long" で失敗する。
      # また create-pull-request は 65536 文字を超える body を切り詰めて警告する
      # ため、あらかじめ収まるサイズに切り詰めておく。
      - name: Set PR body file
        run: |
          log_limit=60000 # bytes (65536 文字の上限に対して十分な余裕)
          log_size=$(wc -c < ./ci-logs/update.md)
          {
            echo '## Automated update'
            echo ''
            echo -n 'started at:  '
            cat ./ci-logs/started_at.txt
            echo -n 'finished at: '
            TZ=Asia/Tokyo date
            echo ''
            echo ''
            echo "log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ''
            if [ "$log_size" -gt "$log_limit" ]; then
              echo 'Log is too long for a pull request body and is truncated below.'
              echo 'The full log is available at the link above.'
              echo ''
            fi
            awk -v limit="$log_limit" '
              { n += length($0) + 1; if (n > limit) exit; print }
            ' ./ci-logs/update.md
            if [ "$log_size" -gt "$log_limit" ]; then
              echo ''
              echo '... (truncated)'
            fi
          } > ./ci-logs/pr-body.md

      - name: test nvim after plugins updates 
        run: |
          TS_OFF=1 USER=aki "$NVIM_EXEC_PATH"  --headless +qa

      - name:  Create PR 
        id: meta
        run: |
          {
            echo "date=$(TZ=Asia/Tokyo date +%Y-%m-%d-%H-%M)"
          } >> $GITHUB_OUTPUT

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: "update(plugins): update nvim plugins ${{ steps.meta.outputs.date }}"
          body-path: ./ci-logs/pr-body.md
          commit-message: "update(plugins): update nvim plugins at ${{ steps.meta.outputs.date }}"
          branch: "update-nvim-plugin-at-${{ steps.meta.outputs.date }}"
          add-paths: |
            nvim/lazy-lock.json
